[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kumonos"
version = "0.1.0"
description = "Local-first knowledge compilation from AI work logs"
requires-python = ">=3.11"

[project.scripts]
kumonos = "kumonos.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
